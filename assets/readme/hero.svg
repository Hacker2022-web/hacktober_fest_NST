<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="wippr — an in-flight firewall for autonomous agents">
  <title>wippr — an in-flight firewall for autonomous agents</title>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 86px; letter-spacing: -4.6px; fill: #EFEBE2; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 21px; fill: #8A8780; letter-spacing: -0.2px; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 16px; white-space: pre; }
    .rise1, .rise2 { transform: translateY(110px); animation: rise 1.1s cubic-bezier(.16,1,.3,1) forwards; }
    .rise2 { animation-delay: .12s; }
    @keyframes rise { to { transform: translateY(0); } }
    .fadein { opacity: 0; animation: fadein .9s ease forwards; }
    .d1 { animation-delay: .7s; } .d2 { animation-delay: .95s; } .d3 { animation-delay: 1.2s; }
    @keyframes fadein { to { opacity: 1; } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { transform-origin: 0 0; animation: pulse 2.4s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes pulse { 0% { r: 4; opacity: .9; } 100% { r: 14; opacity: 0; } }
    </style>

  <rect width="1200" height="440" rx="16" fill="#131313"/>
  <g class="fadein">
    <g transform="translate(508.0, 52)">
      <circle cx="10" cy="10" r="4" fill="#D5A52E"/>
      <circle class="pulse" cx="10" cy="10" r="4" fill="none" stroke="#D5A52E"/>
      <text x="24" y="15" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8A8780">v1.1.0 · open source · runs locally</text>
    </g>
  </g>
  <svg x="0" y="80" width="1200" height="110" overflow="hidden"><text class="title rise1" x="600.0" y="92" text-anchor="middle">an in-flight firewall</text></svg>
  <svg x="0" y="176" width="1200" height="110" overflow="hidden"><text class="title rise2" x="600.0" y="92" text-anchor="middle">for autonomous agents.</text></svg>
  <text class="sub fadein d1" x="600.0" y="318" text-anchor="middle">Blocks prompt-injected tool calls before they run, rewinds the agent, and lets it finish the job.</text>
  <g class="fadein d2">
    <rect x="84.8" y="352" width="1030.4" height="44" rx="10" fill="#0E0E0E" stroke="#3A3936"/>
    <text class="mono" x="104.8" y="379"><tspan fill="#D5A52E">$ </tspan><tspan fill="#EFEBE2">curl -fsSL https://raw.githubusercontent.com/Hacker2022-web/hacktober_fest_NST/main/install.sh | sh</tspan></text>
    <rect class="caret" x="1078.2" y="365" width="9" height="19" fill="#EFEBE2"/>
  </g>

</svg>
