<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="532" viewBox="0 0 1000 532" role="img" aria-label="~/agents/invoice-bot — wippr demo invoice">
  <title>~/agents/invoice-bot — wippr demo invoice</title>
  <defs></defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; white-space: pre; }
